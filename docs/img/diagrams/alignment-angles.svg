<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="t d"><title id="t">Camber, toe and caster</title><desc id="d">Three panels showing camber from the front, toe from above and caster from the side.</desc><rect width="680" height="350" fill="#fbfaf7"/><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">The three alignment angles</text><text x="128" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14161a" text-anchor="middle">camber</text><text x="128" y="90" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">front view</text><text x="340" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14161a" text-anchor="middle">toe</text><text x="340" y="90" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">top view</text><text x="552" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14161a" text-anchor="middle">caster</text><text x="552" y="90" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">side view</text><line x1="128" y1="104" x2="128" y2="262" stroke="#ddd8cd" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="108" y="112" width="40" height="146" rx="6" fill="none" stroke="#1d5d5d" stroke-width="2.5" transform="rotate(7 128 185)"/><line x1="78" y1="270" x2="178" y2="270" stroke="#6b7280" stroke-width="1.5"/><text x="160" y="150" font-family="sans-serif" font-size="10" font-weight="400" fill="#1d5d5d" text-anchor="start">tilt</text><text x="128" y="246" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">vertical</text><line x1="240" y1="185" x2="440" y2="185" stroke="#ddd8cd" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="250" y="150" width="30" height="70" rx="5" fill="none" stroke="#3d434d" stroke-width="2.5" transform="rotate(-5 265 185)"/><rect x="406" y="150" width="30" height="70" rx="5" fill="none" stroke="#3d434d" stroke-width="2.5" transform="rotate(-5 421 185)"/><text x="340" y="250" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">front of vehicle</text><text x="340" y="264" font-family="sans-serif" font-size="10" font-weight="400" fill="#1d5d5d" text-anchor="middle">angle between wheel planes</text><line x1="552" y1="104" x2="552" y2="262" stroke="#ddd8cd" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="566" y1="112" x2="542" y2="256" stroke="#b4451f" stroke-width="2.5"/><circle cx="566" cy="112" r="6" fill="none" stroke="#b4451f" stroke-width="2"/><circle cx="542" cy="256" r="6" fill="none" stroke="#b4451f" stroke-width="2"/><text x="576" y="150" font-family="sans-serif" font-size="9.5" font-weight="400" fill="{'#b4451f'}" text-anchor="start">steering axis</text><text x="552" y="246" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">vertical</text><text x="340.0" y="306" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">Changing ride height moves all three. An alignment is not optional after a lift.</text><text x="340.0" y="320.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Camber is vertical wheel tilt, toe the angle between the wheel planes, caster the steering axis</text><text x="340.0" y="336.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">tilt.</text></svg>
