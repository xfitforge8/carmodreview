<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="t d"><title id="t">Tyre sidewall size code</title><desc id="d">The sidewall size code broken into its parts: section width, aspect ratio, construction, rim diameter, load index and speed rating.</desc><rect width="680" height="280" fill="#fbfaf7"/><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Reading a tyre size: each part of the code is a separate specification</text><rect x="140" y="127.0" width="76" height="46" rx="4" fill="none" stroke="#1d5d5d" stroke-width="2"/><text x="178.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d5d5d" text-anchor="middle">275</text><line x1="178.0" y1="127.0" x2="178.0" y2="108" stroke="#1d5d5d" stroke-width="1.2" stroke-dasharray="3 3"/><text x="178.0" y="100" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1d5d5d" text-anchor="middle">section width</text><text x="178.0" y="86" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">275 mm</text><rect x="236" y="127.0" width="64" height="46" rx="4" fill="none" stroke="#3d434d" stroke-width="2"/><text x="268.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#3d434d" text-anchor="middle">60</text><line x1="268.0" y1="173.0" x2="268.0" y2="196" stroke="#3d434d" stroke-width="1.2" stroke-dasharray="3 3"/><text x="268.0" y="210" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#3d434d" text-anchor="middle">aspect ratio</text><text x="268.0" y="224" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">60% of width</text><rect x="320" y="127.0" width="44" height="46" rx="4" fill="none" stroke="#6b7280" stroke-width="2"/><text x="342.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#6b7280" text-anchor="middle">R</text><line x1="342.0" y1="127.0" x2="342.0" y2="108" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/><text x="342.0" y="100" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#6b7280" text-anchor="middle">construction</text><text x="342.0" y="86" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">radial</text><rect x="384" y="127.0" width="64" height="46" rx="4" fill="none" stroke="#3d434d" stroke-width="2"/><text x="416.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#3d434d" text-anchor="middle">20</text><line x1="416.0" y1="173.0" x2="416.0" y2="196" stroke="#3d434d" stroke-width="1.2" stroke-dasharray="3 3"/><text x="416.0" y="210" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#3d434d" text-anchor="middle">rim diameter</text><text x="416.0" y="224" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">20 inches</text><rect x="500" y="127.0" width="76" height="46" rx="4" fill="none" stroke="#b4451f" stroke-width="2"/><text x="538.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#b4451f" text-anchor="middle">115</text><line x1="538.0" y1="127.0" x2="538.0" y2="108" stroke="#b4451f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="538.0" y="100" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#b4451f" text-anchor="middle">load index</text><text x="538.0" y="86" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">1,215 kg per tyre</text><rect x="596" y="127.0" width="40" height="46" rx="4" fill="none" stroke="#b4451f" stroke-width="2"/><text x="616.0" y="158" font-family="sans-serif" font-size="21" font-weight="700" fill="#b4451f" text-anchor="middle">T</text><line x1="616.0" y1="173.0" x2="616.0" y2="196" stroke="#b4451f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="616.0" y="210" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#b4451f" text-anchor="middle">speed rating</text><text x="616.0" y="224" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">up to 190 km/h</text><text x="224" y="158" font-family="sans-serif" font-size="21" font-weight="400" fill="#6b7280" text-anchor="middle">/</text><text x="340.0" y="250.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Load index and speed rating follow the size on the sidewall. Both must meet or exceed the vehicle</text><text x="340.0" y="266.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">placard.</text></svg>
