<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-labelledby="t d"><title id="t">Exhaust drone band</title><desc id="d">Two curves of cabin sound level against engine speed, showing a resonance hump in the aftermarket system.</desc><rect width="680" height="340" fill="#fbfaf7"/><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Where an exhaust drones</text><rect x="300" y="96" width="160" height="154" fill="#b4451f" opacity="0.07"/><line x1="100" y1="250" x2="640" y2="250" stroke="#6b7280" stroke-width="1.5"/><line x1="100" y1="250" x2="100" y2="96" stroke="#6b7280" stroke-width="1.5"/><polyline points="100,238 160,232 220,226 280,224 340,228 400,236 460,242 520,246 580,248 640,249" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round"/><polyline points="100,236 160,224 220,206 280,180 310,158 340,146 370,148 400,158 430,178 460,200 500,220 560,236 640,243" fill="none" stroke="#b4451f" stroke-width="2.5" stroke-linejoin="round"/><text x="380" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#b4451f" text-anchor="middle">drone band</text><text x="470" y="196" font-family="sans-serif" font-size="10" font-weight="400" fill="#b4451f" text-anchor="start">aftermarket</text><text x="520" y="236" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">stock</text><text x="118" y="268" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">idle</text><text x="380" y="268" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">cruise</text><text x="580" y="268" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">highway</text><text x="76" y="173" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" transform="rotate(-90 76 173)">cabin sound level</text><text x="340.0" y="326.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Illustrative. Drone depends on engine speed, pipe diameter and cabin resonance — not on brand.</text></svg>
