<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="t d"><title id="t">Tyre load range</title><desc id="d">Three tyre sidewall sections of increasing thickness representing P-metric, LT and E load ranges.</desc><rect width="680" height="280" fill="#fbfaf7"/><rect x="75.0" y="186.0" width="110.0" height="44.0" rx="5" fill="none" stroke="#6b7280" stroke-width="2.5"/><text x="130" y="252" font-family="sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">P-metric</text><text x="130" y="270" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">Passenger car construction</text><rect x="261.25" y="175.0" width="137.5" height="55.0" rx="5" fill="none" stroke="#1d5d5d" stroke-width="2.5"/><text x="330" y="252" font-family="sans-serif" font-size="12" font-weight="700" fill="#1d5d5d" text-anchor="middle">LT (C / D / E)</text><text x="330" y="270" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">Light truck, heavier sidewall</text><rect x="447.5" y="164.0" width="165.0" height="66.0" rx="5" fill="none" stroke="#b4451f" stroke-width="2.5"/><text x="530" y="252" font-family="sans-serif" font-size="12" font-weight="700" fill="#b4451f" text-anchor="middle">E rated</text><text x="530" y="270" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">Highest common load range</text><text x="340.0" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Load range describes sidewall construction and load capacity, not tyre size</text><text x="340.0" y="250.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Schematic. Going up a load range stiffens the ride — a common complaint when a truck is fitted with</text><text x="340.0" y="266.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">E-rated tyres for looks.</text></svg>
