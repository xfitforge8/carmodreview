<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="t d"><title id="t">Backspacing versus offset</title><desc id="d">A wheel cross-section showing backspacing measured from the inner lip and offset measured from the rim centreline.</desc><rect width="680" height="280" fill="#fbfaf7"/><rect x="150" y="88" width="380" height="104" rx="8" fill="none" stroke="#14161a" stroke-width="2.5"/><line x1="340.0" y1="70" x2="340.0" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><text x="340.0" y="226" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">rim centreline</text><line x1="294.0" y1="68" x2="294.0" y2="212" stroke="#b4451f" stroke-width="3"/><text x="294.0" y="60" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#b4451f" text-anchor="middle">mounting face</text><line x1="150" y1="198" x2="294.0" y2="198" stroke="#b4451f" stroke-width="1.5"/><line x1="150" y1="192" x2="150" y2="204" stroke="#b4451f" stroke-width="1.5"/><line x1="294.0" y1="192" x2="294.0" y2="204" stroke="#b4451f" stroke-width="1.5"/><text x="222.0" y="218" font-family="sans-serif" font-size="11" font-weight="400" fill="#b4451f" text-anchor="middle">backspacing (mm)</text><line x1="340.0" y1="82" x2="294.0" y2="82" stroke="#1d5d5d" stroke-width="1.5"/><text x="317.0" y="74" font-family="sans-serif" font-size="11" font-weight="400" fill="#1d5d5d" text-anchor="middle">offset (mm)</text><text x="340.0" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Backspacing measures to the inner lip; offset measures from the centreline</text><text x="340.0" y="250.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Both describe the same wheel. Backspacing is measured from the inner edge, offset from the</text><text x="340.0" y="266.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">centreline.</text></svg>
