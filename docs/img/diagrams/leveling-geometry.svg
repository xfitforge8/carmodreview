<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d"><title id="t">Leveling kit geometry</title><desc id="d">Side view of a truck frame showing the factory rake before and the leveled stance after raising the front.</desc><rect width="680" height="300" fill="#fbfaf7"/><line x1="100" y1="200" x2="560" y2="200" stroke="#14161a" stroke-width="3"/><line x1="100" y1="205" x2="100" y2="196" stroke="#6b7280" stroke-width="2"/><text x="180" y="248" font-family="sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">front</text><text x="470" y="248" font-family="sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">rear</text><line x1="180" y1="200" x2="470" y2="174" stroke="#ddd8cd" stroke-width="2" stroke-dasharray="6 4"/><text x="325.0" y="160" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">factory rake</text><line x1="180" y1="200" x2="470" y2="200" stroke="#1d5d5d" stroke-width="2" stroke-dasharray="6 4"/><text x="325.0" y="262" font-family="sans-serif" font-size="11" font-weight="400" fill="#1d5d5d" text-anchor="middle">after a leveling kit, the front is raised to match the rear</text><circle cx="180" cy="200" r="30" fill="none" stroke="#14161a" stroke-width="2.5"/><circle cx="470" cy="200" r="30" fill="none" stroke="#14161a" stroke-width="2.5"/><line x1="226" y1="194" x2="226" y2="160" stroke="#b4451f" stroke-width="2"/><polygon points="226,154 222,164 230,164" fill="#b4451f"/><text x="236" y="174" font-family="sans-serif" font-size="11" font-weight="400" fill="#b4451f" text-anchor="start">lift</text><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Leveling removes the factory rake by raising the front only</text><text x="340.0" y="270.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Side view, exaggerated for clarity. Raising the front changes caster and camber slightly — an</text><text x="340.0" y="286.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">alignment follows.</text></svg>
