<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-labelledby="t d"><title id="t">Cat-back versus axle-back exhaust</title><desc id="d">A simplified exhaust layout showing the extent of a cat-back system versus an axle-back system.</desc><rect width="680" height="240" fill="#fbfaf7"/><rect x="90" y="102" width="110" height="36" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="145.0" y="125" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">engine</text><rect x="230" y="102" width="90" height="36" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="275.0" y="125" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">catalytic</text><rect x="390" y="102" width="80" height="36" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="430.0" y="125" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">muffler</text><rect x="560" y="102" width="90" height="36" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="605.0" y="125" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">tailpipe</text><line x1="200" y1="120" x2="230" y2="120" stroke="#3d434d" stroke-width="4"/><line x1="320" y1="120" x2="390" y2="120" stroke="#3d434d" stroke-width="4"/><line x1="470" y1="120" x2="560" y2="120" stroke="#3d434d" stroke-width="4"/><path d="M 330 60 L 640 60 L 640 84" fill="none" stroke="#1d5d5d" stroke-width="2"/><text x="485" y="52" font-family="sans-serif" font-size="11" font-weight="400" fill="#1d5d5d" text-anchor="middle">cat-back: replaces everything from the catalyst rearward</text><path d="M 480 180 L 640 180 L 640 150" fill="none" stroke="#b4451f" stroke-width="2"/><text x="560" y="198" font-family="sans-serif" font-size="11" font-weight="400" fill="#b4451f" text-anchor="middle">axle-back: muffler and tailpipe only</text><text x="340.0" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">What each exhaust system actually replaces</text></svg>
