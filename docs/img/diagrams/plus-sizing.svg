<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d"><title id="t">Plus sizing diagram</title><desc id="d">Three wheel and tyre assemblies of increasing rim diameter but equal overall diameter.</desc><rect width="680" height="400" fill="#fbfaf7"/><circle cx="130" cy="200" r="100" fill="none" stroke="#1d5d5d" stroke-width="2.5"/><circle cx="130" cy="200" r="62" fill="none" stroke="#1d5d5d" stroke-width="2"/><text x="130" y="204" font-family="sans-serif" font-size="12" font-weight="700" fill="#1d5d5d" text-anchor="middle">17"</text><text x="130" y="350" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">225/65R17</text><line x1="30" y1="360" x2="230" y2="360" stroke="#1d5d5d" stroke-width="1" stroke-dasharray="3 3"/><text x="130" y="374" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">same overall diameter</text><circle cx="315" cy="200" r="118" fill="none" stroke="#6b7280" stroke-width="2.5"/><circle cx="315" cy="200" r="50" fill="none" stroke="#6b7280" stroke-width="2"/><text x="315" y="204" font-family="sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">18"</text><text x="315" y="350" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">235/60R18</text><line x1="197" y1="360" x2="433" y2="360" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="315" y="374" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">same overall diameter</text><circle cx="500" cy="200" r="140" fill="none" stroke="#b4451f" stroke-width="2.5"/><circle cx="500" cy="200" r="34" fill="none" stroke="#b4451f" stroke-width="2"/><text x="500" y="204" font-family="sans-serif" font-size="12" font-weight="700" fill="#b4451f" text-anchor="middle">20"</text><text x="500" y="350" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">245/50R20</text><line x1="360" y1="360" x2="640" y2="360" stroke="#b4451f" stroke-width="1" stroke-dasharray="3 3"/><text x="500" y="374" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#b4451f" text-anchor="middle">same overall diameter</text><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Plus sizing: a larger wheel with a shorter sidewall keeps overall diameter constant</text><text x="340.0" y="370.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Illustrative sidewall ratios. A shorter sidewall means less compliance, so tyre choice changes ride</text><text x="340.0" y="386.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">quality.</text></svg>
