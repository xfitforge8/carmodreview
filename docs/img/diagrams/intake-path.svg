<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img" aria-labelledby="t d"><title id="t">Intake airflow path</title><desc id="d">A diagram of the intake path from outside air through the filter, manifold and throttle body.</desc><rect width="680" height="260" fill="#fbfaf7"/><rect x="80" y="110" width="120" height="40" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="140.0" y="135" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">throttle body</text><rect x="215" y="110" width="150" height="40" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="290.0" y="135" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">intake manifold</text><rect x="380" y="110" width="120" height="40" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="440.0" y="135" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">air filter</text><rect x="515" y="110" width="110" height="40" rx="6" fill="none" stroke="#3d434d" stroke-width="2"/><text x="570.0" y="135" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#3d434d" text-anchor="middle">outside air</text><line x1="200" y1="130" x2="215" y2="130" stroke="#3d434d" stroke-width="4"/><line x1="365" y1="130" x2="380" y2="130" stroke="#3d434d" stroke-width="4"/><line x1="500" y1="130" x2="515" y2="130" stroke="#3d434d" stroke-width="4"/><text x="340.0" y="192" font-family="sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">airflow →</text><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">The intake path: restriction anywhere upstream limits the whole system</text><text x="340.0" y="230.5" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">The filter is one restriction among several. A larger filter downstream of a restrictive MAF housing</text><text x="340.0" y="246.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">does little.</text></svg>
