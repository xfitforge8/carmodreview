<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="t d"><title id="t">Wheel offset diagram</title><desc id="d">Three wheel cross-sections showing positive, zero and negative offset relative to the hub mounting face.</desc><rect width="680" height="320" fill="#fbfaf7"/><line x1="300" y1="66" x2="300" y2="286" stroke="#14161a" stroke-width="2.5"/><text x="300" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#14161a" text-anchor="middle">Hub mounting face</text><rect x="292" y="92" width="140" height="40" rx="6" fill="none" stroke="#1d5d5d" stroke-width="2.5"/><line x1="292" y1="112" x2="316" y2="112" stroke="#1d5d5d" stroke-width="5"/><line x1="408" y1="112" x2="432" y2="112" stroke="#1d5d5d" stroke-width="5"/><text x="362" y="116" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">rim</text><text x="28" y="110" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#1d5d5d" text-anchor="start">Positive offset</text><text x="28" y="125" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">factory typical</text><rect x="230" y="156" width="140" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="2.5"/><line x1="230" y1="176" x2="254" y2="176" stroke="#6b7280" stroke-width="5"/><line x1="346" y1="176" x2="370" y2="176" stroke="#6b7280" stroke-width="5"/><text x="300" y="180" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">rim</text><text x="28" y="174" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#6b7280" text-anchor="start">Zero offset</text><text x="28" y="189" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">face on centreline</text><rect x="160" y="220" width="140" height="40" rx="6" fill="none" stroke="#b4451f" stroke-width="2.5"/><line x1="160" y1="240" x2="184" y2="240" stroke="#b4451f" stroke-width="5"/><line x1="276" y1="240" x2="300" y2="240" stroke="#b4451f" stroke-width="5"/><text x="230" y="244" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">rim</text><text x="28" y="238" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#b4451f" text-anchor="start">Negative offset</text><text x="28" y="253" font-family="sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">pushed outward</text><line x1="300" y1="112" x2="362" y2="112" stroke="#1d5d5d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="370" y="107" font-family="sans-serif" font-size="11" font-weight="400" fill="#1d5d5d" text-anchor="start">offset</text><line x1="300" y1="240" x2="230" y2="240" stroke="#b4451f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="222" y="235" font-family="sans-serif" font-size="11" font-weight="400" fill="#b4451f" text-anchor="end">offset</text><text x="340.0" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Wheel offset: where the mounting face sits relative to the rim centreline</text><text x="340.0" y="306.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Schematic, not to scale. Offset is measured in millimetres from the rim centreline.</text></svg>
