<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="t d"><title id="t">Brake pad bedding sequence</title><desc id="d">A timeline of bedding stages from a clean rotor through progressively harder stops to a cool-down period.</desc><rect width="680" height="280" fill="#fbfaf7"/><rect x="90" y="120" width="500" height="110" fill="none" stroke="#ddd8cd" stroke-width="1.5"/><rect x="90.0" y="120" width="110.0" height="110" fill="#6b7280" opacity="0.10"/><line x1="90.0" y1="120" x2="90.0" y2="230" stroke="#ddd8cd" stroke-width="1"/><text x="145.0" y="250" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">clean rotor</text><rect x="200.0" y="120" width="100.0" height="110" fill="#1d5d5d" opacity="0.10"/><line x1="200.0" y1="120" x2="200.0" y2="230" stroke="#ddd8cd" stroke-width="1"/><text x="250.0" y="250" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">light stops</text><rect x="300.0" y="120" width="140.0" height="110" fill="#1d5d5d" opacity="0.10"/><line x1="300.0" y1="120" x2="300.0" y2="230" stroke="#ddd8cd" stroke-width="1"/><text x="370.0" y="250" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">medium</text><rect x="440.0" y="120" width="90.0" height="110" fill="#b4451f" opacity="0.10"/><line x1="440.0" y1="120" x2="440.0" y2="230" stroke="#ddd8cd" stroke-width="1"/><text x="485.0" y="250" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#b4451f" text-anchor="middle">hard stops</text><rect x="530.0" y="120" width="60.0" height="110" fill="#6b7280" opacity="0.10"/><line x1="530.0" y1="120" x2="530.0" y2="230" stroke="#ddd8cd" stroke-width="1"/><text x="560.0" y="250" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">cool</text><text x="340.0" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Bedding sequence: progressive heat cycles, then a full cool-down</text><text x="340.0" y="266.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">General sequence, not a substitute for the pad manufacturer's own bedding procedure.</text></svg>
