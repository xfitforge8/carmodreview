<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d"><title id="t">Lift methods compared</title><desc id="d">Three lift approaches side by side showing which parameters each one changes.</desc><rect width="680" height="400" fill="#fbfaf7"/><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">What each lift method actually changes</text><text x="140" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b4451f" text-anchor="middle">Spacer kit</text><rect x="116" y="116" width="48" height="12" rx="3" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="126" y="128" width="28" height="140" rx="4" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="114" y="98" width="52" height="16" rx="3" fill="#b4451f" opacity="0.18" stroke="#b4451f" stroke-width="2"/><text x="140" y="168" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">spacer</text><polyline points="118.0,182.0 162.0,188.7 118.0,195.3 162.0,202.0 118.0,208.7 162.0,215.3 118.0,222.0 162.0,228.7 118.0,235.3 162.0,242.0 118.0,248.7 162.0,255.3 118.0,262.0" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-linejoin="round"/><text x="140" y="302" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#b4451f" text-anchor="middle">Ride height only</text><text x="140" y="318" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">stock travel, stock damping</text><text x="340" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1d5d5d" text-anchor="middle">Taller spring</text><rect x="316" y="116" width="48" height="12" rx="3" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="326" y="128" width="28" height="140" rx="4" fill="none" stroke="#3d434d" stroke-width="2"/><line x1="340" y1="136" x2="340" y2="150" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/><polyline points="318.0,136.0 362.0,147.0 318.0,158.0 362.0,169.0 318.0,180.0 362.0,191.0 318.0,202.0 362.0,213.0 318.0,224.0 362.0,235.0 318.0,246.0 362.0,257.0 318.0,268.0" fill="none" stroke="#1d5d5d" stroke-width="2.2" stroke-linejoin="round"/><text x="340" y="170" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">taller</text><text x="340" y="302" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1d5d5d" text-anchor="middle">Height and travel</text><text x="340" y="318" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">damping still fixed</text><text x="540" y="74" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1d5d5d" text-anchor="middle">Coilover</text><rect x="516" y="116" width="48" height="12" rx="3" fill="none" stroke="#3d434d" stroke-width="2"/><rect x="526" y="128" width="28" height="140" rx="4" fill="none" stroke="#3d434d" stroke-width="2"/><polyline points="518.0,136.0 562.0,147.0 518.0,158.0 562.0,169.0 518.0,180.0 562.0,191.0 518.0,202.0 562.0,213.0 518.0,224.0 562.0,235.0 518.0,246.0 562.0,257.0 518.0,268.0" fill="none" stroke="#1d5d5d" stroke-width="2.2" stroke-linejoin="round"/><rect x="518" y="196" width="44" height="11" rx="2" fill="#1d5d5d" opacity="0.18" stroke="#1d5d5d" stroke-width="2"/><text x="540" y="170" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">adjuster</text><text x="540" y="302" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1d5d5d" text-anchor="middle">Height, travel, damping</text><text x="540" y="318" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">serviceable, costs most</text><text x="340.0" y="352" font-family="sans-serif" font-size="11" font-weight="400" fill="#3d434d" text-anchor="middle">All three change alignment geometry, so all three want an alignment afterwards.</text><text x="340.0" y="386.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">Simplified side sections. Area covered, warranty and serviceability differ by product.</text></svg>
