<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="t d"><title id="t">Open cone versus sealed airbox</title><desc id="d">Two engine bays: an open cone drawing hot bay air, and a sealed airbox ducted to the fender.</desc><rect width="680" height="360" fill="#fbfaf7"/><text x="340.0" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="middle">Two intakes, two different sources of air</text><text x="180" y="78" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#3d434d" text-anchor="middle">open cone in the engine bay</text><rect x="50" y="100" width="260" height="180" rx="10" fill="none" stroke="#ddd8cd" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="80" y="180" width="80" height="70" rx="4" fill="none" stroke="#6b7280" stroke-width="2"/><text x="120" y="220" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">engine</text><polygon points="190,140 240,150 240,210 190,220" fill="none" stroke="#b4451f" stroke-width="2.5"/><text x="215" y="230" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#b4451f" text-anchor="middle">filter</text><line x1="112" y1="120" x2="178" y2="148" stroke="#b4451f" stroke-width="1.6"/><polygon points="178,148 170.1,149.0 173.2,141.6" fill="#b4451f"/><line x1="250" y1="118" x2="232" y2="142" stroke="#b4451f" stroke-width="1.6"/><polygon points="232,142 233.0,134.1 239.4,138.9" fill="#b4451f"/><line x1="120" y1="250" x2="180" y2="208" stroke="#b4451f" stroke-width="1.6"/><polygon points="180,208 176.6,215.2 172.0,208.7" fill="#b4451f"/><text x="180" y="306" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#b4451f" text-anchor="middle">filter draws engine-bay air</text><text x="500" y="78" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#3d434d" text-anchor="middle">sealed box ducted to the fender</text><rect x="370" y="100" width="260" height="180" rx="10" fill="none" stroke="#ddd8cd" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="400" y="180" width="80" height="70" rx="4" fill="none" stroke="#6b7280" stroke-width="2"/><text x="440" y="220" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">engine</text><rect x="500" y="150" width="90" height="70" rx="4" fill="none" stroke="#1d5d5d" stroke-width="2.5"/><text x="545" y="190" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">sealed box</text><polyline points="512,158 430,158 430,104 356,104" fill="none" stroke="#1d5d5d" stroke-width="4" stroke-linejoin="round"/><line x1="380" y1="104" x2="350" y2="104" stroke="#1d5d5d" stroke-width="3"/><polygon points="350,104 356.9,100.0 356.9,108.0" fill="#1d5d5d"/><text x="408" y="96" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">outside air</text><text x="500" y="306" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#1d5d5d" text-anchor="middle">filter draws from outside the bay</text><text x="340.0" y="346.0" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">A sealed box fed from the fender sees cooler air than an open element in the bay.</text></svg>
